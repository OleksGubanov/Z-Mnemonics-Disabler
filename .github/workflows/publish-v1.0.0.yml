name: Publish v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'OleksGubanov/Z-Mnemonics-Disabler'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run regression tests
        run: python -m pytest -q tests

      - name: Build Krita installation ZIP
        run: python tools/build_release.py

      - name: Verify installation ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('dist/Z_Mnemonics_Disabler_v1.0.0.zip')
          with ZipFile(archive) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              assert 'Z_Mnemonics_Disabler.desktop' in names
              assert 'Z_Mnemonics_Disabler/__init__.py' in names
              assert 'Z_Mnemonics_Disabler/main.py' in names
              assert 'Z_Mnemonics_Disabler/guard.py' in names
              assert 'Z_Mnemonics_Disabler/policy.py' in names
          print('Validated', archive, archive.stat().st_size, 'bytes')
          PY

      - name: Publish GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; leaving it unchanged.'
          else
            gh release create v1.0.0 \
              dist/Z_Mnemonics_Disabler_v1.0.0.zip \
              --target "$GITHUB_SHA" \
              --title 'Z Mnemonics Disabler v1.0.0' \
              --notes-file docs/RELEASE_NOTES_v1.0.0.md
          fi
